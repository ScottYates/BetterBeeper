<!--
  The Better Beeper app icon.

  This file is the source of truth for the artwork. tools/build-icon.js renders
  it into the two files the app actually uses:

    build/icon.ico         - copied by electron-builder into the executable,
                             the installer and the shortcuts
    src/assets/icon.png    - packed into the app, and handed to the windows so
                             they carry the right icon when the app is run
                             from source

  One file, so the three places the icon shows up cannot drift apart. Editing
  the artwork here and running `npm run icon` is the whole workflow.

  The shape is a white speech balloon on the app's own accent blue, with "BB"
  knocked out of it in the plate colour. The balloon says "chat", the letters
  say "this one", and knocking them out rather than drawing them on top keeps
  the mark to one shape inside another, which is what still reads at 16 pixels
  in a crowded taskbar.

  The official Beeper icon is a blue circle with an outlined balloon, so the
  squared off plate and the solid white balloon are what tell the two apart.

  The letterforms are drawn as paths, not set as text. A font is a dependency
  the build machine may not have, and a monogram that changes shape because
  somebody installed a different font is not a stable icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- The plate: the app's accent blue, lightened towards the top left. -->
    <linearGradient id="plate" x1="0.08" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4a9bff" />
      <stop offset="1" stop-color="#0a53c8" />
    </linearGradient>
  </defs>

  <rect x="14" y="14" width="484" height="484" rx="118" fill="url(#plate)" />

  <!-- The balloon, with its tail swept off to the lower left. -->
  <path
    fill="#ffffff"
    d="M256 116C172 116 104 168 104 234c0 38 22 71 57 90l-25 74 96-47c7 1 15 2 24 2 84 0 152-53 152-120S340 116 256 116z"
  />

  <!--
    The two B's, knocked out of the balloon in the plate colour.

    The letter is one path with two counters, so it is filled with evenodd and
    the counters come out as holes rather than as more blue. The second B is a
    copy of the first, shifted sideways by a use element, so both letters are
    guaranteed to be the same shape.

    The counters sit at local y 24 to 52 and y 74 to 120, so nothing else may
    be placed over those two bands without checking them against this path.
  -->
  <g transform="translate(179 180) scale(0.72)" fill="#0a53c8" fill-rule="evenodd">
    <path
      id="letterB"
      d="M0 0 h46 c28 0 44 14 44 38 0 16-8 27-21 33 17 6 27 18 27 35 0 26-19 39-50 39 H0 Z
         M24 24 v28 h20 c12 0 19-5 19-14 0-9-7-14-19-14 Z
         M24 74 v46 h24 c14 0 22-8 22-23 0-15-8-23-22-23 Z"
    />
    <use href="#letterB" x="118" />
  </g>
</svg>
