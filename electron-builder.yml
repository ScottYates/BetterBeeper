appId: com.yates.better-beeper
productName: Better Beeper
copyright: Copyright © 2026 Scott Yates

directories:
  output: release
  buildResources: build

# Only ship what the app actually runs; devDependencies (electron, builder)
# are resolved by electron-builder itself and must not be bundled.
files:
  - src/**/*
  - package.json
  - '!**/*.map'
  - '!tools/**'

asar: true
compression: normal
removePackageScripts: true

# The update handoff helper, which takes the install from here once this process
# is gone. It is a WinExe, so it has no console and no window can flash during an
# update. Shipped outside the asar because it has to be launched as a real file
# on disk, not read out of the archive.
#
# extraResources copies a real directory. If it is missing, the installer builds
# happily and then cannot update itself, and that only shows up later, on a
# machine, during an update. So it is built by the scripts that call
# electron-builder - tools/release.js and tools/dist.js - rather than left to be
# remembered.
#
# It is deliberately NOT an electron-builder `beforeBuild` hook. That hook is
# about node_modules, not general pre-build work: it is resolved as a module to
# import rather than a command to run, and a truthy return tells electron-builder
# that node_modules is being handled outside it. Using it for this produced
# "Cannot find module '<project>\\node tools/build-helper.js'" and failed the
# build. A plain call from the script is unambiguous and testable.
extraResources:
  - from: build/update-helper
    to: update-helper
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  # No custom icon yet; Electron's default is used.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Better Beeper
  deleteAppDataOnUninstall: false

# The app talks only to a localhost Beeper Desktop instance, so it needs no
# network entitlements beyond the loopback API and an optional AI endpoint.
mac:
  target:
    - dmg
  category: public.app-category.social-networking

linux:
  target:
    - AppImage
  category: Network
