appId: com.yates.better-beeper
productName: Better Beeper
copyright: Copyright © 2026 Scott Yates

directories:
  output: release
  buildResources: build

# Only ship what the app actually runs; devDependencies (electron, builder)
# are resolved by electron-builder itself and must not be bundled.
files:
  - src/**/*
  - package.json
  - '!**/*.map'
  - '!tools/**'

asar: true
compression: normal
removePackageScripts: true

# The update handoff helper, which takes the install from here once this process
# is gone. It is a WinExe, so it has no console and no window can flash during an
# update. Shipped outside the asar because it has to be launched as a real file
# on disk, not read out of the archive.
#
# Build it first with:
#   dotnet publish tools/update-helper -c Release -o build/update-helper
extraResources:
  - from: build/update-helper
    to: update-helper
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  # No custom icon yet; Electron's default is used.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Better Beeper
  deleteAppDataOnUninstall: false

# The app talks only to a localhost Beeper Desktop instance, so it needs no
# network entitlements beyond the loopback API and an optional AI endpoint.
mac:
  target:
    - dmg
  category: public.app-category.social-networking

linux:
  target:
    - AppImage
  category: Network
