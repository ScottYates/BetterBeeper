<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>actions-check harness</title>
    <!--
      The real stylesheet, on purpose. The visibility assertions below measure
      where the Clear list button actually lands, and that depends entirely on
      the modal's max-height and the body's overflow. Measuring it without the
      CSS would pass while the button sat below the fold in the app.
    -->
    <link rel="stylesheet" href="../src/renderer/styles.css" />
  </head>
  <body>
    <!--
      openModal() mounts into #modal-root, so the harness needs it.
    -->
    <div id="modal-root" hidden></div>

    <!--
      The rest of the app's chrome is here because the menu is asked about a
      chat: which messages can be edited is a property of the chat as much as
      of the message, so the thread has to have one open for the question to
      mean anything. These are the elements thread.js, sidebar.js and ui.js
      actually query, copied from the download harness, which opens a chat the
      same way. They are empty on purpose.
    -->
    <div id="chat-list"></div>

    <div id="thread" hidden>
      <div id="thread-avatar"></div>
      <div id="thread-name"></div>
      <div id="thread-sub"></div>
      <div id="account-badges"></div>
      <button id="btn-pin"></button>
      <button id="btn-mute"></button>
      <button id="btn-archive"></button>
      <button id="btn-unread"></button>
      <button id="btn-refresh"></button>
      <div id="message-list"></div>
      <div id="attachment-chips"></div>
      <div id="reply-preview" hidden>
        <span id="reply-preview-text"></span>
        <button id="btn-cancel-reply"></button>
      </div>
      <textarea id="composer" rows="1"></textarea>
      <button id="btn-attach"></button>
      <button id="btn-attach-image"></button>
      <button id="btn-emoji"></button>
      <button id="btn-send"></button>
    </div>

    <div id="thread-empty"></div>
    <div id="filter-row"></div>
    <div id="inbox-label"></div>
    <div id="search-input"></div>
    <div id="search-scope"></div>
    <div id="live-status"></div>
    <div id="toast-root"></div>
  </body>
</html>
