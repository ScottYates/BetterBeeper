<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>archive-check harness</title>
  </head>
  <body>
    <!--
      Blank page loaded by tools/archive-check.js. It exists so the test can
      import the renderer's modules as real ES modules from a file:// origin; a
      data: URL cannot import modules.

      The test installs its own window.beeper stub, so nothing here talks to a
      real Beeper instance. The chat list is the one piece of the real layout the
      test needs, because renderChats() writes into it by id.
    -->
    <div id="chat-list"></div>
  </body>
