<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../src/renderer/styles.css" />
    <title>share-check harness</title>
  </head>
  <body>
    <!--
      Page loaded by tools/share-check.js. It exists so the test can import the
      renderer's share.js and modals.js as real ES modules from a file://
      origin; a data: URL cannot import modules.

      openModal() writes into #modal-root and toast() into #toast-root, so the
      two roots the share picker actually touches are here.

      The real stylesheet is loaded as well, and that is deliberate. The
      picker scrolls its list on its own, and whether that scroll area is
      actually bounded depends on a chain of flex boxes between the modal
      body and the list. Without the stylesheet the chain is not there, every
      height is the content height, and a list that cannot scroll is
      indistinguishable from one that can. The stylesheet is what makes the
      scrolling tests test scrolling.
    -->
    <div id="modal-root" hidden></div>
    <div id="toast-root"></div>
  </body>
</html>
